# electron-builder 打包設定（跟 package.json 分開放，理由同 desktop-pet /
# control-center 的 electron-builder.yml）。`npm run dist` 會自動讀這個檔。
#
# 注意：dist 會把 desktop-wall 這個資料夾打包起來，但**兩個 web 專案的 dist/ 和
# server/ 不在裡面**——servers.js 用 path.join(__dirname, '..', 'sticky-wall-web')
# 找它們，portable exe 放在 file_search/ 底下（跟 sticky-wall-web / index-wall-web
# 同層）才能正常運作。這是刻意的：web 專案自己會更新，不想每次都重打包 exe。
appId: com.reqw123.desktop-wall
productName: desktop-wall

directories:
  output: dist

files:
  - "**/*"
  - "!dist/**"

asar: true

win:
  target: portable

portable:
  artifactName: "${productName}.exe"
