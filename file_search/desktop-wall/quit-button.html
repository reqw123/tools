<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<title>結束桌面牆</title>
<style>
  /* 整頁透明——只有中間那顆圓按鈕會被看到。這個視窗本身在主行程刻意
     「不」設 setIgnoreMouseEvents：不管牆現在是背景（穿透）還是互動模式，
     這裡永遠正常吃滑鼠，按下去永遠有效——這是它存在的唯一理由。 */
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    user-select: none;
  }
  #wrap {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  button {
    width: 40px;
    height: 40px;
    display: grid;
    place-items: center;
    border: none;
    border-radius: 50%;
    background: linear-gradient(135deg, #e2685a, #b5372a);
    color: #fff;
    cursor: pointer;
    box-shadow: 0 2px 10px -2px rgba(181, 55, 42, 0.55), 0 0 0 0 rgba(181, 55, 42, 0.4);
    animation: pulse 2.6s ease-in-out infinite;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  button:hover {
    transform: scale(1.15) rotate(90deg);
    box-shadow: 0 4px 16px -2px rgba(181, 55, 42, 0.85);
    animation-play-state: paused;
  }
  button:active { transform: scale(0.92) rotate(90deg); }
  svg { width: 20px; height: 20px; }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 2px 10px -2px rgba(181, 55, 42, 0.55), 0 0 0 0 rgba(181, 55, 42, 0.35); }
    50% { box-shadow: 0 2px 10px -2px rgba(181, 55, 42, 0.55), 0 0 0 8px rgba(181, 55, 42, 0); }
  }
  @media (prefers-reduced-motion: reduce) {
    button { animation: none; }
  }
</style>
</head>
<body>
<div id="wrap">
  <button id="quitBtn" title="結束桌面牆程式" aria-label="結束桌面牆程式">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
      <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
    </svg>
  </button>
</div>
<script>
  document.getElementById('quitBtn').addEventListener('click', () => window.dwQuit.quit());
</script>
</body>
</html>
