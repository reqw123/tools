<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<title>focus note</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    font-family: "Microsoft JhengHei", system-ui, sans-serif;
    -webkit-app-region: drag; /* 整個視窗可拖曳移動——這是「懸浮視窗」這個做法的重點賣點 */
  }
  #card {
    box-sizing: border-box;
    width: 100%;
    height: 100%;
    padding: 14px;
    color: #23201a;
  }
  #card h3 { margin: 0 0 8px; font-size: 15px; }
  #card p { margin: 0; opacity: .8; white-space: pre-wrap; font-size: 13px; }
  #close {
    -webkit-app-region: no-drag;
    position: absolute;
    top: 6px;
    right: 6px;
    width: 20px;
    height: 20px;
    border: none;
    border-radius: 50%;
    background: rgba(0, 0, 0, .22);
    color: #fff;
    cursor: pointer;
    font-size: 12px;
    line-height: 20px;
    text-align: center;
    padding: 0;
  }
  #close:hover { background: rgba(0, 0, 0, .42); }
</style>
</head>
<body>
  <button id="close" title="取消釘選">✕</button>
  <div id="card">
    <h3 id="t"></h3>
    <p id="b"></p>
  </div>
<script>
  const params = new URLSearchParams(location.search);
  document.getElementById('card').style.background = params.get('color') || '#eee';
  document.getElementById('t').textContent = params.get('title') || '';
  document.getElementById('b').textContent = params.get('body') || '';
  // window.close() 是標準 web API，Electron 會攔截並關掉這個 BrowserWindow，
  // 不需要 preload/IPC。
  document.getElementById('close').onclick = () => window.close();
</script>
</body>
</html>
