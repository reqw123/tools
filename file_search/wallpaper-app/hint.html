<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<title>桌面牆快捷鍵提示</title>
<style>
  /* 整頁透明——只有中間那張卡片會被看到。視窗本身在主行程是 frameless +
     transparent + 滑鼠穿透，這裡負責淡入／停留／淡出的視覺。 */
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    user-select: none;
    cursor: default;
  }
  #wrap {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #card {
    max-width: 80vw;
    box-sizing: border-box;
    padding: 18px 40px;
    font: 600 22px/1.4 "Microsoft JhengHei", "Segoe UI", system-ui, sans-serif;
    color: #fff;
    text-align: center;
    white-space: nowrap;
    background: rgba(17, 24, 39, 0.92);
    border: 2px solid #3b82f6;
    border-radius: 14px;
    box-shadow: 0 12px 36px rgba(0, 0, 0, 0.45);
    /* 閒置狀態：完全透明、略往下位移。收到 hint 才加 .show。 */
    opacity: 0;
    transform: translateY(8px) scale(0.96);
    transition: opacity 150ms ease, transform 150ms ease;
  }
  #card.show {
    opacity: 1;
    transform: none;
  }
  #card.hide {
    opacity: 0;
    transform: translateY(-6px) scale(0.98);
    transition: opacity 340ms ease, transform 340ms ease;
  }
</style>
</head>
<body>
<div id="wrap"><div id="card"></div></div>
<script>
  const card = document.getElementById('card');
  let holdTimer = null;

  window.dwHint.onHint((text) => {
    clearTimeout(holdTimer);
    card.textContent = text;
    card.classList.remove('hide');
    // 強制 reflow，讓 transition 從頭跑一次（連按同一個快捷鍵時也會重新淡入）。
    void card.offsetWidth;
    card.classList.add('show');
    holdTimer = setTimeout(() => {
      card.classList.remove('show');
      card.classList.add('hide');
    }, 900);
  });
</script>
</body>
</html>
