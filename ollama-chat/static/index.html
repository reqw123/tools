<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ollama 聊天室</title>
<link rel="stylesheet" href="style.css" />
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
</head>
<body>
<div id="app">
  <header class="topbar">
    <h1>🦙 Ollama 聊天室</h1>
    <div class="topbar-controls">
      <select id="modelSelect" title="選擇模型"></select>
      <button id="settingsBtn" class="icon-btn" title="設定">⚙️</button>
      <button id="newChatBtn" class="icon-btn" title="新對話">🗑️ 新對話</button>
    </div>
  </header>

  <div id="settingsPanel" class="settings-panel hidden">
    <label>
      System prompt（系統提示，套用在整段對話開頭）
      <textarea id="systemPrompt" rows="3" placeholder="例如：你是一個樂於助人的中文助理…"></textarea>
    </label>
    <label class="temp-row">
      溫度（越高越隨性、越低越穩定）
      <input type="range" id="temperature" min="0" max="1.5" step="0.1" value="0.7" />
      <span id="temperatureVal">0.7</span>
    </label>
    <div class="test-row">
      <button id="testConnBtn" class="icon-btn" type="button">測試連線</button>
      <span id="ollamaStatus" class="hint"></span>
    </div>
  </div>

  <main id="messages" class="messages"></main>

  <div id="attachments" class="attachments hidden"></div>

  <footer class="composer">
    <div class="composer-row">
      <input type="file" id="imageInput" accept="image/*" multiple hidden />
      <input type="file" id="docInput" accept=".pdf,.docx,.txt,.md,.csv,.json,.log" multiple hidden />
      <button id="attachImageBtn" class="icon-btn" title="附加圖片（需模型支援看圖）">🖼️</button>
      <button id="attachDocBtn" class="icon-btn" title="附加文件（pdf/docx/txt…）">📎</button>
      <textarea id="input" rows="1" placeholder="輸入訊息…（Enter 送出，Shift+Enter 換行）"></textarea>
      <button id="sendBtn" class="send-btn" title="送出">送出</button>
      <button id="stopBtn" class="send-btn stop hidden" title="停止">■</button>
    </div>
  </footer>
</div>
<script src="app.js"></script>
</body>
</html>
